<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=440, height=280">
  <title>Autopsy Promo Tile</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 440px;
      height: 280px;
      background: linear-gradient(135deg, #1a2332 0%, #2d3f5f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, transparent 1px, transparent 30px),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, transparent 1px, transparent 30px);
      opacity: 0.5;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 24px;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
    }

    h1 {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -1px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .tagline {
      font-size: 16px;
      color: #a8d5e5;
      font-weight: 500;
      line-height: 1.4;
    }

    .version {
      position: absolute;
      bottom: 12px;
      right: 12px;
      font-size: 12px;
      color: #8ab4c8;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg width="80" height="80" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="128" height="128" rx="24" fill="#00d9a3"/>
        <path d="M64 32L48 48H32V80H48L64 96L80 80H96V48H80L64 32Z" fill="#1a2332" stroke="#ffffff" stroke-width="3"/>
        <circle cx="64" cy="64" r="8" fill="#00d9a3"/>
        <path d="M52 64H40M88 64H76M64 52V40M64 88V76" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Autopsy</h1>
    <p class="tagline">Find what to close<br>with surgical precision</p>
  </div>
  <div class="version">v0.23.0</div>
</body>
</html>
